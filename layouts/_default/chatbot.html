{{- define "main" }}
<article class="chatbot-page" data-api="{{ site.Params.chatbot.apiProxy | default "" }}" data-timeout="{{ site.Params.chatbot.requestTimeoutSec | default 12 }}" data-max-articles="{{ site.Params.chatbot.maxArticles | default 80 }}">
  <header class="page-header">
    <h1>博客问答助手（后端 DeepSeek / Qwen）</h1>
    <p>前端仅提交问题与文章列表，由后端大模型完成检索与回答。默认启用引用溯源模式（[1][2]）。</p>
  </header>

  <section class="chatbot-shell" aria-label="博客问答">
    <div class="chatbot-log" id="chatbot-log" aria-live="polite">
      <div class="chatbot-msg chatbot-msg-bot">
        <p>你好，我是博客助手。你可以问：</p>
        <ul>
          <li>“Linux 高可用相关文章有哪些？”</li>
          <li>“转载与编译系列里有哪些内容？”</li>
          <li>“俞军产品经理12条在哪里？”</li>
        </ul>
      </div>
    </div>

    <form class="chatbot-form" id="chatbot-form">
      <input id="chatbot-input" type="text" placeholder="输入你的问题..." maxlength="200" autocomplete="off" />
      <button type="submit">发送</button>
    </form>
  </section>
</article>

<script>
(function () {
  const logEl = document.getElementById("chatbot-log");
  const formEl = document.getElementById("chatbot-form");
  const inputEl = document.getElementById("chatbot-input");
  const pageEl = document.querySelector(".chatbot-page");
  const CHAT_API = (pageEl && pageEl.dataset.api ? pageEl.dataset.api : "").trim();
  const API_TIMEOUT_SEC = Math.max(3, Math.min(60, Number(pageEl && pageEl.dataset.timeout ? pageEl.dataset.timeout : 12)));
  const MAX_ARTICLES = Math.max(10, Math.min(200, Number(pageEl && pageEl.dataset.maxArticles ? pageEl.dataset.maxArticles : 80)));
  let docs = [];

  function escapeHtml(s) {
    return (s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function stripHtml(s) {
    return (s || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
  }

  function asArray(v) {
    if (Array.isArray(v)) return v;
    if (typeof v === "string" && v.trim()) return [v];
    return [];
  }

  function appendMessage(role, html) {
    const div = document.createElement("div");
    div.className = "chatbot-msg " + (role === "user" ? "chatbot-msg-user" : "chatbot-msg-bot");
    div.innerHTML = html;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    return div;
  }

  function renderSources(sources) {
    if (!sources || !sources.length) return "";
    const items = sources.map(function (s, idx) {
      const title = s.title || ("来源 " + (idx + 1));
      const link = s.permalink || "#";
      const id = s.id || (idx + 1);
      return "<li>[" + id + "] <a href='" + link + "'>" + escapeHtml(title) + "</a></li>";
    }).join("");
    return "<div class='chatbot-sources'><p><strong>来源索引：</strong></p><ol>" + items + "</ol></div>";
  }

  function buildArticleList() {
    return docs.slice(0, MAX_ARTICLES).map(function (d, idx) {
      return {
        id: idx + 1,
        title: d.title,
        permalink: d.permalink,
        summary: (d.summary || "").slice(0, 260),
        series: asArray(d.series),
        tags: asArray(d.tags),
        section: d.section || "",
        date: d.date || ""
      };
    });
  }

  async function callLlm(question) {
    if (!CHAT_API) {
      throw new Error("后端问答接口未配置");
    }

    const controller = new AbortController();
    const timer = setTimeout(function () {
      controller.abort();
    }, API_TIMEOUT_SEC * 1000);

    try {
      const res = await fetch(CHAT_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: question,
          articles: buildArticleList()
        }),
        signal: controller.signal
      });

      if (!res.ok) {
        throw new Error("后端接口状态异常: " + res.status);
      }
      const data = await res.json();
      const text = data && data.answer ? data.answer : "";
      const sources = data && Array.isArray(data.sources) ? data.sources : [];
      if (!text) throw new Error("模型返回为空");
      return { text: text, sources: sources };
    } finally {
      clearTimeout(timer);
    }
  }

  function renderLlmAnswer(text) {
    const safe = escapeHtml(text).replace(/\n/g, "<br>");
    return "<p><strong>模型回答：</strong></p><p>" + safe + "</p>";
  }

  async function answer(question) {
    const q = (question || "").trim();
    if (!q) return;

    if (!CHAT_API) {
      appendMessage("bot", "<p>后端问答接口未配置，请联系管理员。</p><p>你也可先用 <a href='/search/'>搜索页</a>。</p>");
      return;
    }

    const pending = appendMessage("bot", "<p>正在调用后端大模型进行检索与回答...</p>");
    try {
      const llm = await callLlm(q);
      pending.innerHTML = renderLlmAnswer(llm.text) + renderSources(llm.sources);
    } catch (err) {
      pending.innerHTML =
        "<p><strong>后端模型超时或不可用。</strong></p>" +
        "<p class='chatbot-note'>原因：" + escapeHtml(err && err.message ? err.message : "unknown") + "</p>" +
        "<p>请稍后重试，或先使用 <a href='/search/'>搜索页</a>。</p>";
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  fetch("/index.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      docs = (data || []).map(function (d) {
        return {
          title: d.title || "",
          permalink: d.permalink || "#",
          summary: stripHtml(d.summary || ""),
          content: stripHtml(d.content || ""),
          series: asArray(d.series),
          tags: asArray(d.tags),
          section: d.section || "",
          date: d.date || ""
        };
      });
      if (CHAT_API) {
        appendMessage("bot", "<p>文章索引加载完成，已连接后端模型（DeepSeek/Qwen 可切换），可开始提问。</p>");
      } else {
        appendMessage("bot", "<p>文章索引加载完成，但后端接口未配置。</p>");
      }
    })
    .catch(function () {
      appendMessage("bot", "<p>索引加载失败，请稍后刷新重试。</p>");
    });

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    const q = (inputEl.value || "").trim();
    if (!q) return;
    appendMessage("user", "<p>" + escapeHtml(q) + "</p>");
    inputEl.value = "";
    answer(q);
  });
})();
</script>
{{- end }}
