{{- if eq .Type "abc" -}}
  <div class="abcjs-block">
    <div class="abcjs-sheet"></div>
    <script type="text/plain" class="abcjs-source">{{- .Inner -}}</script>
  </div>
{{- else -}}
  {{- $result := transform.HighlightCodeBlock . -}}
  {{- $result.Wrapped -}}
{{- end -}}

{{ if eq .Language "mermaid" }}
<div class="mermaid">
{{ .Inner | safeHTML }}
</div>
{{ else }}
<pre><code class="language-{{ .Language }}">
{{ .Inner }}
</code></pre>
{{ end }}
