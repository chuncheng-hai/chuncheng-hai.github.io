name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - ".github/workflows/hugo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: "0.157.0"          # ← 建议更新到此版本或更高（extended 支持 Sass/SCSS 等）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # 如果你坚持用旧版： HUGO_VERSION: "0.147.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive          # 保持原样，如果你用了 Hugo modules 或 themes as submodule

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Hugo
        run: |
          wget -O hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz"
          tar -xzf hugo.tar.gz hugo
          chmod +x hugo
          mkdir -p ~/.local/bin
          mv hugo ~/.local/bin/
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Verify Hugo version
        run: hugo version

      - name: Build
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
