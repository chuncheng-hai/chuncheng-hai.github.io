baseURL = "https://chuncheng-hai.github.io/"
languageCode = "zh-CN"
title = "Chuncheng's Blog"
defaultContentLanguage = "zh-cn"
theme = "PaperMod"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  author = "Chuncheng Hai"
  description = "技术写作、人文社科转载与系统化学习笔记"
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.chatbot]
    apiProxy = "https://blog-chatbot-proxy.chuncheng-hai-bot.workers.dev"
    requestTimeoutSec = 12

  [params.homeInfoParams]
    Title = "Chuncheng's Blog"
    Content = "人文社科转载、名人演讲双语整理、系统化技术写作。"

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "series"
  name = "系列"
  url = "/series/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 50

[[menu.main]]
  identifier = "chatbot"
  name = "问答"
  url = "/chatbot/"
  weight = 60

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true #  Markdown 渲染器设成“硬换行”


[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.3
  minMatchCharLength = 2
  limit = 50
  keys = ["title", "permalink", "summary", "content"]
