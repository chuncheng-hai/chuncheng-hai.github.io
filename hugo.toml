baseURL = "https://chuncheng-hai.github.io/"
languageCode = "zh-CN"
title = "Chuncheng's Blog"
defaultContentLanguage = "zh-cn"
theme = "PaperMod"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  series = "series"

[related]
  includeNewer = true
  threshold = 20
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100


[params]
  # 作者名（显示在文章元信息）
  author = "Chuncheng Hai"
  # 全站默认描述（用于 SEO 与社交卡片）
  description = "技术写作、人文社科、学习笔记"
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.chatbot]
    apiProxy = "https://blog-chatbot-proxy.chuncheng-hai-bot.workers.dev"
    requestTimeoutSec = 12
    maxArticles = 80

  [params.homeInfoParams]
    # 首页标题（若下面配置了 homeHero.title，会优先使用 homeHero）
    Title = ""
    # 首页简介（若下面配置了 homeHero.content，会优先使用 homeHero）
    Content = ""

  # 首页第一个动效区块（Hero）配置
  # 想改首页第一屏文案/按钮/头像，主要改这里
  [params.homeHero]
    # 小标题（主标题上方）
    kicker = "CHUNCHENG HAI · THINK IN SYSTEMS"
    # 主标题与描述
    title = "Chuncheng's Blog"
    content = "改变自己、改变世界"
    # 三个按钮：文案 + 链接
    primaryBtnText = "开始搜索"
    primaryBtnUrl = "/search/"
    secondaryBtnText = "浏览系列"
    secondaryBtnUrl = "/series/"
    thirdBtnText = "文章归档"
    thirdBtnUrl = "/archives/"
    # 胶囊标签（可增减）
    chips = ["人文社科", "技术写作","投资理财","自学指南","Linux & DevOps","LLM & Agent"]
    # 头像卡片
    avatar = "/images/profile-picture.jpg"
    avatarName = "Chuncheng Hai"
    # 头像旁提示
    floatingNote = "日拱一卒，功不唐捐"

  # 浏览器标签左上角图标（favicon）
  # 已设置为圆形头像版本（SVG）
  [params.assets]
    favicon = "/images/favicon-round.svg"
    favicon16x16 = "/images/favicon-round.svg"
    favicon32x32 = "/images/favicon-round.svg"
    apple_touch_icon = "/images/profile-picture.jpg"

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "series"
  name = "系列"
  url = "/series/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 50

[[menu.main]]
  identifier = "chatbot"
  name = "问答"
  url = "/chatbot/"
  weight = 60

[[menu.main]]
  identifier = "tutorial"
  name = "教程"
  url = "/tutorial/"
  weight = 65

[[menu.main]]
  identifier = "about"
  name = "关于我"
  url = "/about/"
  weight = 70

[[menu.main]]
  identifier = "diary"
  name = "日记"
  url = "/diary/"
  weight = 80

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = true #  Markdown 渲染器设成“硬换行”


[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.3
  minMatchCharLength = 2
  limit = 50
  keys = ["title", "permalink", "summary", "content"]
