baseURL = "https://chuncheng-hai.github.io/"
languageCode = "zh-CN"
title = "Chuncheng's Blog"
defaultContentLanguage = "zh-cn"
theme = "PaperMod"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  author = "Chuncheng Hai"
  description = "技术写作、人文社科转载与系统化学习笔记"
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "Chuncheng's Blog"
    Content = "人文社科转载、名人演讲双语整理、系统化技术写作。"

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "series"
  name = "系列"
  url = "/series/"
  weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
